{% extends "base.html" %}
{% block title %}Sign in · SocialControl{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-12 col-sm-8 col-md-5 col-lg-4">
  <h1 class="h4 mb-3 text-center">SocialControl</h1>
  <form method="post" action="/login" class="card card-body shadow-sm">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
    <label class="form-label">Email</label>
    <input class="form-control mb-3" type="email" name="email" autocomplete="username" required autofocus>
    <label class="form-label">Password</label>
    <input class="form-control mb-3" type="password" name="password" autocomplete="current-password" required>
    {% if needs_code %}
    <label class="form-label">Authenticator code</label>
    <input class="form-control mb-3" type="text" name="code" inputmode="numeric" pattern="[0-9 ]{6,7}" autocomplete="one-time-code" maxlength="7" required>
    {% endif %}
    <button class="btn btn-primary">Sign in</button>
  </form>
</div></div>
{% endblock %}
