name: socialcontrol

services:
  db:
    image: postgres:16
    container_name: socialcontrol-db
    environment:
      POSTGRES_USER: socialcontrol
      POSTGRES_PASSWORD: socialcontrol
      POSTGRES_DB: socialcontrol
    ports:
      - "127.0.0.1:5433:5432"   # 5433 on the host to avoid clashing with other local databases
    volumes:
      - sc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialcontrol"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sc_pgdata:
